
name: Hello World and Pytest

on:
  push:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Print message
        run: echo "Hello World! My first GitHub Actions workflow is running."

  run-pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Check repository files
        run: |
          echo "Current directory:"
          pwd
          echo "Repository files:"
          ls -la
          echo "Python files:"
          find . -type f -name "*.py"

      - name: Check test discovery
        run: python -m pytest --collect-only -v

      - name: Run testcases
        run: python -m pytest -v test_math.py
